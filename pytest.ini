[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src .
addopts = -p no:asyncio
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary and Corner Case tests
    tier3: Tier 3 Cross-Feature Interaction tests
    tier4: Tier 4 Real-World Application Scenario tests
    slow: Slow-running numerical tests
